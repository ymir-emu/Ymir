name: CI build

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  packages: write
  contents: read

env:
  USERNAME: ymir-emu
  VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  build-windows:
    name: windows-${{ matrix.arch.name }}-${{ matrix.build-set.name }}
    runs-on: ${{ matrix.arch.runner }}

    strategy:
      fail-fast: false

      matrix:
        arch:
          - name: x64
            runner: windows-2025
            vcpkg_triplet: x64-win-llvm-static-md
          - name: a64
            runner: windows-11-arm
            vcpkg_triplet: arm64-windows
        build-set:
          - name: full
            library-only: "no"
          - name: libonly
            library-only: "yes"

    steps:
      # Set up MASM for lzma
      - name: Set up MASM
        uses: glslang/setup-masm@bd171b9b0a619ff6237c164fab5fb920cc579889 # v1.4
        if: ${{ matrix.arch.name == 'x64' }}

      - name: Set up Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Bootstrap vcpkg
        if: ${{ matrix.build-set.library-only == 'no' }}
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat

      - name: Cache vcpkg
        if: ${{ matrix.build-set.library-only == 'no' }}
        id: cache-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: windows-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
          CXX: clang++
          CC: clang
        run: |
          if ("${{ matrix.build-set.library-only }}" -eq "no") {
            cmake -B ${{ steps.strings.outputs.build-output-dir }} `
              -DVCPKG_TARGET_TRIPLET=${{ matrix.arch.vcpkg_triplet }} `
              -DCMAKE_CXX_COMPILER=clang++ `
              -DCMAKE_C_COMPILER=clang `
              -DCMAKE_BUILD_TYPE=Debug `
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
              -DBUILD_SHARED_LIBS=OFF `
              -DYmir_ENABLE_DEVLOG=OFF `
              -DYmir_ENABLE_IMGUI_DEMO=OFF `
              -DYmir_ENABLE_UPDATE_CHECKS=ON `
              -DYmir_ENABLE_SANDBOX=OFF `
              -DYmir_ENABLE_YMDASM=ON `
              -DYmir_ENABLE_IPO=OFF `
              -DYmir_LIBRARY_ONLY=OFF `
              -S ${{ github.workspace }} `
              -G Ninja
          } else {
            cmake -B ${{ steps.strings.outputs.build-output-dir }} `
              -DCMAKE_CXX_COMPILER=clang++ `
              -DCMAKE_C_COMPILER=clang `
              -DCMAKE_BUILD_TYPE=Debug `
              -DBUILD_SHARED_LIBS=OFF `
              -DYmir_ENABLE_DEVLOG=OFF `
              -DYmir_ENABLE_IPO=OFF `
              -DYmir_LIBRARY_ONLY=ON `
              -S ${{ github.workspace }} `
              -G Ninja
          }

      - name: Build
        env:
          CXX: clang++
          CC: clang
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel

  build-linux:
    name: linux-${{ matrix.arch.name }}-${{ matrix.build-set.name }}
    runs-on: ${{ matrix.arch.runner }}

    strategy:
      fail-fast: false

      matrix:
        arch:
          - name: x64
            runner: ubuntu-24.04
            vulkan_arch: x86_64
          - name: a64
            runner: ubuntu-24.04-arm
            vulkan_arch: aarch64
        build-set:
          - name: full
            library-only: "no"
          - name: libonly
            library-only: "yes"

    steps:
      - name: Cache Vulkan SDK with DXC build (AArch64)
        if: matrix.arch.name == 'a64'
        id: cache-dxc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}
          key: dxc-aarch64-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}

      - name: Set up Vulkan SDK
        id: vulkan-sdk
        if: steps.cache-dxc.outputs.cache-hit != 'true'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Build DXC for Vulkan SDK (AArch64)
        if: matrix.arch.name == 'a64'  && steps.cache-dxc.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd $VULKAN_SDK/..
          ./vulkansdk --skip-deps --maxjobs dxc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git make pkg-config \
            cmake ninja-build gnome-desktop-testing \
            libasound2-dev libpulse-dev libaudio-dev \
            libjack-dev libsndio-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev mono-complete libltdl-dev clang-18 \
            autoconf autoconf-archive automake

      - name: Bootstrap vcpkg
        if: ${{ matrix.build-set.library-only == 'no' }}
        shell: bash
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg
        if: ${{ matrix.build-set.library-only == 'no' }}
        id: cache-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: linux-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
          VULKAN_SDK: '/home/runner/vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}/${{ matrix.arch.vulkan_arch }}'
        run: |
          if [ ${{ matrix.build-set.library-only }} = 'no' ]; then
            cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_C_COMPILER=clang-18 \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DBUILD_SHARED_LIBS=OFF \
              -DYmir_ENABLE_DEVLOG=OFF \
              -DYmir_ENABLE_IMGUI_DEMO=OFF \
              -DYmir_ENABLE_UPDATE_CHECKS=ON \
              -DYmir_ENABLE_SANDBOX=OFF \
              -DYmir_ENABLE_YMDASM=ON \
              -DYmir_ENABLE_IPO=OFF \
              -DYmir_LIBRARY_ONLY=OFF \
              -S ${{ github.workspace }} \
              -G Ninja
          else
            cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_C_COMPILER=clang-18 \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_SHARED_LIBS=OFF \
              -DYmir_ENABLE_DEVLOG=OFF \
              -DYmir_ENABLE_IPO=OFF \
              -DYmir_LIBRARY_ONLY=ON \
              -S ${{ github.workspace }} \
              -G Ninja
          fi

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel

  build-freebsd:
    name: freebsd-${{ matrix.arch.name }}-${{ matrix.build-set.name }}
    runs-on: ${{ matrix.arch.runner }}
    defaults:
      run:
        shell: cpa.sh {0}

    strategy:
      fail-fast: false

      matrix:
        arch:
          - name: x64
            runner: ubuntu-24.04
          # - name: arm64
          #   runner: ubuntu-24.04
        build-set:
          - name: full
            library-only: "no"
          - name: libonly
            library-only: "yes"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          architecture: ${{ matrix.arch.name }}
          version: '15.1'

      - name: Install dependencies
        run: |
          sudo pkg upgrade -y
          sudo pkg install -y cmake-core evdev-proto git gmake libX11 libXcursor \
            libXext libXfixes libXi libXrandr libXrender libXScrnSaver libXtst libglvnd \
            libinotify ninja patchelf pkgconf python3 unzip vulkan-loader zip

      - name: Cache vcpkg
        if: ${{ matrix.build-set.library-only == 'no' }}
        id: cache-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/vcpkg/vcpkg
            ${{ github.workspace }}/vcpkg_cache
          key: freebsd-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Bootstrap vcpkg
        if: ${{ matrix.build-set.library-only == 'no' && steps.cache-vcpkg.outputs.cache-hit != 'true' }}
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
        shell: cpa.sh {0} --environment-variables VCPKG_BINARY_SOURCES
        run: |
          if [ ${{ matrix.build-set.library-only }} = 'no' ]; then
            # /usr/bin/unzip is incompatible with unzipping the cache contents,
            # so prioritize /usr/local/bin/unzip instead.
            PATH=/usr/local/bin:${PATH} \
            cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DBUILD_SHARED_LIBS=OFF \
              -DYmir_ENABLE_DEVLOG=OFF \
              -DYmir_ENABLE_IMGUI_DEMO=OFF \
              -DYmir_ENABLE_UPDATE_CHECKS=ON \
              -DYmir_ENABLE_SANDBOX=OFF \
              -DYmir_ENABLE_YMDASM=ON \
              -DYmir_ENABLE_IPO=OFF \
              -DYmir_LIBRARY_ONLY=OFF \
              -S ${{ github.workspace }} \
              -G Ninja
          else
            cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_SHARED_LIBS=OFF \
              -DYmir_ENABLE_DEVLOG=OFF \
              -DYmir_ENABLE_IPO=OFF \
              -DYmir_LIBRARY_ONLY=ON \
              -S ${{ github.workspace }} \
              -G Ninja
          fi

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel

  build-macos:
    name: macos-${{ matrix.arch.name }}-${{ matrix.build-set.name }}
    runs-on: macos-latest

    strategy:
      fail-fast: false

      matrix:
        arch:
          - name: "x64"
            isa_name: "x86_64"
            triplet_arch: "x64"
          - name: "arm64"
            isa_name: "arm64"
            triplet_arch: "arm64"
          # Disabled because vcpkg doesn't support universal binaries
          # See https://github.com/microsoft/vcpkg/discussions/19454
          #- name: "universal"
          #  isa_name: "'x86_64;arm64'"
        build-set:
          - name: full
            library-only: "no"
          - name: libonly
            library-only: "yes"

    steps:
      - name: Set up Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          stripdown: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Bootstrap vcpkg
        if: ${{ matrix.build-set.library-only == 'no' }}
        shell: bash
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg
        if: ${{ matrix.build-set.library-only == 'no' }}
        id: cache-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: macos-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
        run: |
          if [ ${{ matrix.build-set.library-only }} = 'no' ]; then
            cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DVCPKG_TARGET_TRIPLET=${{ matrix.arch.triplet_arch }}-osx12 \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch.isa_name }} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DBUILD_SHARED_LIBS=OFF \
              -DYmir_ENABLE_DEVLOG=OFF \
              -DYmir_ENABLE_IMGUI_DEMO=OFF \
              -DYmir_ENABLE_UPDATE_CHECKS=ON \
              -DYmir_ENABLE_SANDBOX=OFF \
              -DYmir_ENABLE_YMDASM=ON \
              -DYmir_ENABLE_IPO=OFF \
              -DYmir_LIBRARY_ONLY=OFF \
              -S ${{ github.workspace }} \
              -G Ninja
          else
            cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch.isa_name }} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DBUILD_SHARED_LIBS=OFF \
              -DYmir_ENABLE_DEVLOG=OFF \
              -DYmir_ENABLE_IPO=OFF \
              -DYmir_LIBRARY_ONLY=ON \
              -S ${{ github.workspace }} \
              -G Ninja
          fi

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel
