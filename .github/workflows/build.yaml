name: Shared build

on:
  workflow_call:
    inputs:
      dev-build:
        required: true
        type: boolean
      debug-symbols:
        required: false
        default: false
        type: boolean
      build-version:
        required: false
        default: ""
        type: string
      prerelease-version:
        required: false
        default: ""
        type: string
    outputs:
      app-version:
        description: "The app version string as shown in the About window"
        value: ${{ jobs.get-project-version.outputs.project-version-unfiltered }}
      build-timestamp:
        description: "The build timestamp"
        value: ${{ jobs.get-project-version.outputs.build-timestamp }}
  workflow_dispatch: # Enable manual runs
    inputs:
      dev-build:
        required: true
        type: boolean
      debug-symbols:
        required: false
        default: false
        type: boolean
      build-version:
        required: false
        default: ""
        type: string
      prerelease-version:
        required: false
        default: ""
        type: string

permissions:
  packages: write
  contents: read

env:
  USERNAME: ymir-emu
  VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  get-project-version:
    runs-on: ubuntu-latest
    name: Get project version
    outputs:
      project-version: ${{ steps.project-version.outputs.project-version }}
      project-version-unfiltered: ${{ steps.project-version.outputs.project-version-unfiltered }}
      build-timestamp: ${{ steps.project-version.outputs.build-timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Get project version
        id: project-version
        shell: bash
        run: |
          if [ ${{ inputs.dev-build }} = true ]; then
            export PROJ_VER="v$(sed -nr "s/project\(Ymir\s+VERSION\s+(\S+)\)/\1/p" CMakeLists.txt)-dev+${GITHUB_SHA::8}"
          else
            export PROJ_VER="${GITHUB_REF_NAME}"
          fi
          echo "project-version=${PROJ_VER//+/_}" >> "$GITHUB_OUTPUT"
          echo "project-version-unfiltered=${PROJ_VER}" >> "$GITHUB_OUTPUT"
          echo "build-timestamp=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  build-windows:
    name: windows-${{ matrix.c_compiler }}-${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}
    needs: [get-project-version]

    strategy:
      fail-fast: false

      matrix:
        build_type:
          - ${{ inputs.debug-symbols && 'RelWithDebInfo' || 'Release' }}
        # Notes about compilers:
        # - MSVC (cl) produces much slower code and takes a long time to complete the LTO step
        c_compiler: [clang] # [clang, cl]
        arch:
          - name: "x86_64-SSE2"
            enable_avx2_option: "OFF"
            runner: windows-2025
            target: x64
            vcpkg_triplet: x64-win-llvm-static-md
            dxc_arch: x64
          - name: "x86_64-AVX2"
            enable_avx2_option: "ON"
            runner: windows-2025
            target: x64
            vcpkg_triplet: x64-win-llvm-avx2-static-md
            dxc_arch: x64
          - name: "ARM64"
            enable_avx2_option: "OFF"
            runner: windows-11-arm
            target: arm64
            vcpkg_triplet: arm64-windows
            dxc_arch: arm64
        include:
          - c_compiler: clang
            cpp_compiler: clang

    steps:
      # Set up MASM for lzma
      - name: Set up MASM
        uses: glslang/setup-masm@bd171b9b0a619ff6237c164fab5fb920cc579889 # v1.4

      # Fix incompatibility between MSVC STL and LLVM-provided Clang.
      # The yvals_core.h header enforces a strict STL1000 static assertion requiring
      # a newer Clang version (22+) than what comes pre-installed on the image (20).
      - name: Install newer LLVM/Clang
        if: ${{ matrix.arch.runner == 'windows-2025' }}
        run: choco install llvm --version=23.1.3 -y

      - name: Set up Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          export BUILD_VERSION=${{ needs.get-project-version.outputs.project-version }}
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "ymir-artifact-name=ymir-windows-${{ matrix.arch.name }}-${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir-debug-symbols-name=dbgsym-ymir-windows-${{ matrix.arch.name }}-${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure MSVC
        if: ${{ matrix.c_compiler == 'cl' }}
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.arch.target }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: windows-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
          CXX: ${{ matrix.cpp_compiler }}
          CC: ${{ matrix.c_compiler }}
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.arch.vcpkg_triplet }}
          -DBUILD_SHARED_LIBS=OFF
          -DYmir_AVX2=${{ matrix.arch.enable_avx2_option }}
          -DYmir_ENABLE_IPO=ON
          -DYmir_ENABLE_DEVLOG=OFF
          -DYmir_ENABLE_IMGUI_DEMO=OFF
          -DYmir_ENABLE_UPDATE_CHECKS=ON
          -DYmir_ENABLE_SANDBOX=OFF
          -DYmir_ENABLE_YMDASM=OFF
          -DYmir_ENABLE_TESTS=OFF
          -DYmir_EXTRA_INLINING=ON
          -DYmir_VERSION_PRERELEASE=${{ inputs.prerelease-version }}
          -DYmir_VERSION_BUILD=${{ inputs.build-version }}
          -DYmir_BUILD_TIMESTAMP=${{ needs.get-project-version.outputs.build-timestamp }}
          -DYmir_DEV_BUILD=${{ inputs.dev-build && 'ON' || 'OFF' }}
          -DYmir_LIBRARY_ONLY=OFF
          -S ${{ github.workspace }}
          -G Ninja

      - name: Build
        env:
          CXX: ${{ matrix.cpp_compiler }}
          CC: ${{ matrix.c_compiler }}
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

      ## FIXME: Catch2 integration still isn't working
      #- name: Test
      #  working-directory: ${{ steps.strings.outputs.build-output-dir }}
      #  run: ctest --build-config ${{ matrix.build_type }}

      - name: Get gamecontrollerdb.txt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdqinc/SDL_GameControllerDB
          sparse-checkout: |
            gamecontrollerdb.txt
            LICENSE
          sparse-checkout-cone-mode: false
          path: gcdb

      - name: Package Ymir artifact
        run: |
          $licensesDir = Join-Path (Get-Location) "licenses"
          New-Item -ItemType Directory -Force -Path $licensesDir | Out-Null
          Get-ChildItem -Recurse -Path "${{ steps.strings.outputs.build-output-dir }}\vcpkg_installed" -Filter copyright |
            ForEach-Object {
              $port = Split-Path $_.DirectoryName -Leaf
              $dest = Join-Path $licensesDir "$port-LICENSE.txt"
              Copy-Item $_.FullName $dest -Force
            }

          Copy-Item -Path ".\apps\ymir-sdl3\res\licenses\*"                     -Destination "$licensesDir\"  -Recurse
          Copy-Item -Path ".\vendor\concurrentqueue\concurrentqueue\LICENSE.md" -Destination "$licensesDir\concurrentqueue-LICENSE.md"
          Copy-Item -Path ".\vendor\dr_libs\LICENSE"                            -Destination "$licensesDir\dr_libs-LICENSE"
          Copy-Item -Path ".\vendor\imgui\imgui\LICENSE.txt"                    -Destination "$licensesDir\imgui-LICENSE.txt"
          Copy-Item -Path ".\vendor\libchdr\libchdr\LICENSE.txt"                -Destination "$licensesDir\libchdr-LICENSE.txt"
          Copy-Item -Path ".\vendor\libchdr\libchdr\deps\lzma-26.02\LICENSE"    -Destination "$licensesDir\lzma-LICENSE"
          Copy-Item -Path ".\vendor\lz4\lz4\lib\LICENSE"                        -Destination "$licensesDir\lz4-LICENSE"
          Copy-Item -Path ".\vendor\mio\LICENSE"                                -Destination "$licensesDir\mio-LICENSE"
          Copy-Item -Path ".\vendor\stb\stb\LICENSE"                            -Destination "$licensesDir\stb-LICENSE"
          Copy-Item -Path ".\vendor\xxHash\xxHash\LICENSE"                      -Destination "$licensesDir\xxHash-LICENSE"
          Copy-Item -Path ".\LICENSE"                                           -Destination "$licensesDir\Ymir-LICENSE"
          Copy-Item -Path "${{ github.workspace }}\gcdb\LICENSE"                -Destination "$licensesDir\SDL_GameControllerDB-LICENSE"
          Copy-Item -Path "${{ github.workspace }}\gcdb\gamecontrollerdb.txt"   -Destination ".\gamecontrollerdb.txt"

          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip" -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath .\dxc

          $items = @()
          $items += "README.md"
          $items += "CHANGELOG.md"
          $items += "TROUBLESHOOTING.md"
          $items += "gamecontrollerdb.txt"
          $items += "$licensesDir/"
          $items += "build/apps/ymir-sdl3/ymir-sdl3.exe"
          $items += "dxc\bin\${{ matrix.arch.dxc_arch }}\dxcompiler.dll"
          $items += "dxc\bin\${{ matrix.arch.dxc_arch }}\dxil.dll"
          Compress-Archive -Path $items -DestinationPath "${{ steps.strings.outputs.ymir-artifact-name }}.zip"

      - name: Upload Ymir artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.strings.outputs.ymir-artifact-name }}
          path: ${{ steps.strings.outputs.ymir-artifact-name }}.zip

      - name: Upload debug symbols
        if: ${{ inputs.debug-symbols }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.strings.outputs.ymir-debug-symbols-name }}
          path: |
            build/apps/ymir-sdl3/ymir-sdl3.exe
            build/apps/ymir-sdl3/ymir-sdl3.pdb

  build-linux:
    name: linux-${{ matrix.compiler }}-${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}
    needs: [get-project-version]

    strategy:
      fail-fast: false

      matrix:
        build_type:
          - ${{ inputs.debug-symbols && 'RelWithDebInfo' || 'Release' }}
        # Notes about compilers:
        # - GCC (gcc) produces much slower code and takes a long time to complete the LTO step
        compiler: [clang] # [clang, gcc]
        arch:
          - name: "x86_64-SSE2"
            enable_avx2_option: "OFF"
            runner: ubuntu-24.04
            vulkan_arch: x86_64
          - name: "x86_64-AVX2"
            enable_avx2_option: "ON"
            runner: ubuntu-24.04
            vulkan_arch: x86_64
          - name: "AArch64-NEON"
            enable_avx2_option: "OFF" # doesn't matter actually
            runner: ubuntu-24.04-arm
            vulkan_arch: aarch64
        include:
          - compiler: clang
            c_compiler: "clang-18"
            cpp_compiler: "clang++-18"

    steps:
      - name: Cache Vulkan SDK with DXC build (AArch64)
        id: cache-dxc
        if: matrix.arch.name == 'AArch64-NEON'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}
          key: dxc-aarch64-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}

      - name: Set up Vulkan SDK
        id: vulkan-sdk
        if: steps.cache-dxc.outputs.cache-hit != 'true'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Build DXC for Vulkan SDK (AArch64)
        if: matrix.arch.name == 'AArch64-NEON' && steps.cache-dxc.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd $VULKAN_SDK/..
          ./vulkansdk --skip-deps --maxjobs dxc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          export BUILD_VERSION=${{ needs.get-project-version.outputs.project-version }}
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "ymir-artifact-name=ymir-linux-${{ matrix.arch.name }}-${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git make pkg-config \
            cmake ninja-build gnome-desktop-testing \
            libasound2-dev libpulse-dev libaudio-dev \
            libjack-dev libsndio-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev mono-complete libltdl-dev clang-18 \
            autoconf autoconf-archive automake

      - name: Bootstrap vcpkg
        shell: bash
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: linux-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
          VULKAN_SDK: '/home/runner/vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}/${{ matrix.arch.vulkan_arch }}'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DBUILD_SHARED_LIBS=OFF
          -DYmir_AVX2=${{ matrix.arch.enable_avx2_option }}
          -DYmir_ENABLE_IPO=ON
          -DYmir_ENABLE_DEVLOG=OFF
          -DYmir_ENABLE_IMGUI_DEMO=OFF
          -DYmir_ENABLE_UPDATE_CHECKS=ON
          -DYmir_ENABLE_SANDBOX=OFF
          -DYmir_ENABLE_YMDASM=OFF
          -DYmir_ENABLE_TESTS=OFF
          -DYmir_EXTRA_INLINING=ON
          -DYmir_VERSION_PRERELEASE=${{ inputs.prerelease-version }}
          -DYmir_VERSION_BUILD=${{ inputs.build-version }}
          -DYmir_BUILD_TIMESTAMP=${{ needs.get-project-version.outputs.build-timestamp }}
          -DYmir_DEV_BUILD=${{ inputs.dev-build && 'ON' || 'OFF' }}
          -DYmir_LIBRARY_ONLY=OFF
          -S ${{ github.workspace }}
          -G Ninja

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

      ## FIXME: Catch2 integration still isn't working
      #- name: Test
      #  working-directory: ${{ steps.strings.outputs.build-output-dir }}
      #  run: ctest --build-config ${{ matrix.build_type }}

      - name: Get gamecontrollerdb.txt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdqinc/SDL_GameControllerDB
          sparse-checkout: |
            gamecontrollerdb.txt
            LICENSE
          sparse-checkout-cone-mode: false
          path: gcdb

      - name: Package artifacts
        run: |
          mkdir -p licenses
          find "${{ steps.strings.outputs.build-output-dir }}/vcpkg_installed" -type f -path "*/share/*/copyright" | while read -r file; do
            port=$(basename "$(dirname "$file")")
            cp "$file" "licenses/${port}-LICENSE.txt"
          done
          cp -Rf apps/ymir-sdl3/res/licenses/*                    ./licenses/
          cp -f vendor/concurrentqueue/concurrentqueue/LICENSE.md licenses/concurrentqueue-LICENSE.md
          cp -f vendor/dr_libs/LICENSE                            licenses/dr_libs-LICENSE
          cp -f vendor/imgui/imgui/LICENSE.txt                    licenses/imgui-LICENSE.txt
          cp -f vendor/libchdr/libchdr/LICENSE.txt                licenses/libchdr-LICENSE.txt
          cp -f vendor/libchdr/libchdr/deps/lzma-26.02/LICENSE    licenses/lzma-LICENSE
          cp -f vendor/lz4/lz4/lib/LICENSE                        licenses/lz4-LICENSE
          cp -f vendor/mio/LICENSE                                licenses/mio-LICENSE
          cp -f vendor/stb/stb/LICENSE                            licenses/stb-LICENSE
          cp -f vendor/xxHash/xxHash/LICENSE                      licenses/xxHash-LICENSE
          cp -f LICENSE                                           licenses/Ymir-LICENSE
          cp -f ${{ github.workspace }}/gcdb/LICENSE              licenses/SDL_GameControllerDB-LICENSE
          cp -f ${{ github.workspace }}/gcdb/gamecontrollerdb.txt gamecontrollerdb.txt
          tar cJvfh ${{ steps.strings.outputs.ymir-artifact-name }}.tar.xz README.md CHANGELOG.md TROUBLESHOOTING.md gamecontrollerdb.txt licenses/ -C build/apps/ymir-sdl3 ymir-sdl3

      - name: Upload Ymir artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.strings.outputs.ymir-artifact-name }}
          path: ${{ steps.strings.outputs.ymir-artifact-name }}.tar.xz

  build-macos:
    name: macos-${{ matrix.arch.name }}
    runs-on: macos-latest
    needs: [get-project-version]

    strategy:
      fail-fast: false

      matrix:
        build_type:
          - ${{ inputs.debug-symbols && 'RelWithDebInfo' || 'Release' }}
        arch:
          - name: "x64"
            isa_name: "x86_64"
            triplet_arch: "x64"
            enable_avx2_option: "ON"
          - name: "arm64"
            isa_name: "arm64"
            triplet_arch: "arm64"
            enable_avx2_option: "OFF"
          # Disabled because vcpkg doesn't support universal binaries
          # See https://github.com/microsoft/vcpkg/discussions/19454
          #- name: "universal"
          #  isa_name: "'x86_64;arm64'"

    steps:
      - name: Set up Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          export BUILD_VERSION=${{ needs.get-project-version.outputs.project-version }}
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "ymir-artifact-name=ymir-macos-${{ matrix.arch.name }}-${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap vcpkg
        shell: bash
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: macos-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch.isa_name }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DVCPKG_TARGET_TRIPLET=${{ matrix.arch.triplet_arch }}-osx12
          -DYmir_AVX2=${{ matrix.arch.enable_avx2_option }}
          -DYmir_ENABLE_IPO=ON
          -DYmir_ENABLE_DEVLOG=OFF
          -DYmir_ENABLE_IMGUI_DEMO=OFF
          -DYmir_ENABLE_UPDATE_CHECKS=ON
          -DYmir_ENABLE_SANDBOX=OFF
          -DYmir_ENABLE_YMDASM=OFF
          -DYmir_EXTRA_INLINING=ON
          -DYmir_ENABLE_TESTS=OFF
          -DYmir_VERSION_PRERELEASE=${{ inputs.prerelease-version }}
          -DYmir_VERSION_BUILD=${{ inputs.build-version }}
          -DYmir_BUILD_TIMESTAMP=${{ needs.get-project-version.outputs.build-timestamp }}
          -DYmir_DEV_BUILD=${{ inputs.dev-build && 'ON' || 'OFF' }}
          -DYmir_LIBRARY_ONLY=OFF
          -S ${{ github.workspace }}
          -G Ninja

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel

      ## FIXME: Catch2 integration still isn't working
      #- name: Test
      #  working-directory: ${{ steps.strings.outputs.build-output-dir }}
      #  run: ctest --build-config ${{ matrix.build_type }}

      - name: Get gamecontrollerdb.txt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdqinc/SDL_GameControllerDB
          sparse-checkout: |
            gamecontrollerdb.txt
            LICENSE
          sparse-checkout-cone-mode: false
          path: gcdb

      - name: Package artifacts
        run: |
          mkdir licenses
          find "${{ steps.strings.outputs.build-output-dir }}/vcpkg_installed" -type f -path "*/share/*/copyright" | while read -r file; do
            port=$(basename "$(dirname "$file")")
            cp "$file" "licenses/${port}-LICENSE.txt"
          done
          cp -Rf apps/ymir-sdl3/res/licenses/*                    ./licenses/
          cp -f vendor/concurrentqueue/concurrentqueue/LICENSE.md licenses/concurrentqueue-LICENSE.md
          cp -f vendor/dr_libs/LICENSE                            licenses/dr_libs-LICENSE
          cp -f vendor/imgui/imgui/LICENSE.txt                    licenses/imgui-LICENSE.txt
          cp -f vendor/libchdr/libchdr/LICENSE.txt                licenses/libchdr-LICENSE.txt
          cp -f vendor/libchdr/libchdr/deps/lzma-26.02/LICENSE    licenses/lzma-LICENSE
          cp -f vendor/lz4/lz4/lib/LICENSE                        licenses/lz4-LICENSE
          cp -f vendor/mio/LICENSE                                licenses/mio-LICENSE
          cp -f vendor/stb/stb/LICENSE                            licenses/stb-LICENSE
          cp -f vendor/xxHash/xxHash/LICENSE                      licenses/xxHash-LICENSE
          cp -f LICENSE                                           licenses/Ymir-LICENSE
          cp -f ${{ github.workspace }}/gcdb/LICENSE              licenses/SDL_GameControllerDB-LICENSE
          cp -f ${{ github.workspace }}/gcdb/gamecontrollerdb.txt gamecontrollerdb.txt
          zip -r ${{ github.workspace }}/${{ steps.strings.outputs.ymir-artifact-name }}.zip licenses README.md CHANGELOG.md TROUBLESHOOTING.md gamecontrollerdb.txt
          cd ${{ github.workspace }}/build/apps/ymir-sdl3/
          target="$(readlink -f ymir-sdl3.app/Contents/MacOS/ymir-sdl3)"
          rm ymir-sdl3.app/Contents/MacOS/ymir-sdl3
          mv "$target" ymir-sdl3.app/Contents/MacOS/ymir-sdl3
          codesign --force --deep --sign - ymir-sdl3.app
          zip -r ${{ github.workspace }}/${{ steps.strings.outputs.ymir-artifact-name }}.zip ymir-sdl3.app

      - name: Upload Ymir artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.strings.outputs.ymir-artifact-name }}
          path: ${{ steps.strings.outputs.ymir-artifact-name }}.zip
          retention-days: 90
